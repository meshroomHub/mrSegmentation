[project]
name = "mrSegmentation"
version = "1.6.0"
description = "Segmentation and matting nodes for Meshroom."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.*",
    "ram",
    "groundingdino-py==0.4.0",
    "segment-anything==1.0",
    "birefnet",
    "scipy",  # needed for ram
    "fairscale",  # needed for ram
    "einops",  # needed for birefnet
    "kornia",  # needed for birefnet
    "sam3",
    "setuptools<81",  # sam3 imports pkg_resources, removed from setuptools 81
    "psutil",  # needed for sam3
]

# Meshroom discovers the nodes from the plugin folder, not site-packages.
# uv only installs the plugin's dependencies into its venv.
[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
ram = { git = "https://github.com/xinyu1205/recognize-anything.git", rev = "7cb804a8609e9f4b1a50b7f31436d2df40bb9481" }
birefnet = { git = "https://github.com/meshroomHubWarehouse/BiRefNet.git", rev = "c93a617f2b81088d740c173dd2eb3690b7cdced6" }
sam3 = { git = "https://github.com/facebookresearch/sam3.git", rev = "7f473cfd983d5eb43040ff608f66bff0d7bdcb53" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.meshroom]
publisher = "meshroomHub"
requirements = "Nvidia GPU with CUDA >= 12.4. AliceVision Python bindings with pyalicevision.parallelization (AliceVision develop from 2026.02). SAM 3 nodes: the gated facebook/sam3 checkpoint, set with RDS_SAM3_MODEL_PATH (see INSTALL.md)."
# Paths are relative to the plugin root, where the assets below are downloaded.
# An environment variable of the same name overrides them.
env = [
    { key = "RDS_RECOGNITION_MODEL_PATH", type = "path", value = "models/ram_plus_swin_large_14m.pth" },
    { key = "RDS_DETECTION_CONFIG_PATH", type = "path", value = "models/GroundingDINO_SwinT_OGC.py" },
    { key = "RDS_DETECTION_MODEL_PATH", type = "path", value = "models/groundingdino_swint_ogc.pth" },
    { key = "RDS_SEGMENTATION_MODEL_PATH", type = "path", value = "models/sam_vit_h_4b8939.pth" },
    { key = "RDS_TOKENIZER_PATH", type = "path", value = "models/tokenizer" },
    { key = "TRANSFORMERS_OFFLINE", type = "string", value = "TRUE" },
]

# Models of https://gitlab.com/alicevision/imagepromptnnmodels, pinned on a commit.
[[tool.meshroom.assets]]
name = "RAM_plus_weights"
category = "Weights"
path = "models/ram_plus_swin_large_14m.pth"
url = "https://gitlab.com/alicevision/imagepromptnnmodels/-/raw/01e3b228a52230712b61c2e59edb878049d4fb5b/models/ram_plus_swin_large_14m.pth"
